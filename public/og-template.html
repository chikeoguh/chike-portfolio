<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#020408;
  font-family:'Inter',sans-serif;
  color:#edf2f7;
  position:relative;
  padding:60px 72px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
/* animated grid */
.grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,255,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,136,.035) 1px,transparent 1px);
  background-size:56px 56px;
  pointer-events:none;
}
.radial{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 70% at 15% 50%,rgba(0,255,136,.09),transparent 65%),
             radial-gradient(ellipse 60% 60% at 90% 30%,rgba(0,212,255,.07),transparent 60%);
  pointer-events:none;
}
.dots-tl{position:absolute;top:28px;left:32px;display:flex;gap:8px}
.dot{width:14px;height:14px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.window-title{position:absolute;top:30px;left:80px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#4a5568;letter-spacing:.1em}

.top{position:relative;z-index:2}
.pill{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 18px;
  border:1px solid rgba(0,255,136,.32);
  background:rgba(0,255,136,.05);
  border-radius:999px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;color:#00ff88;
  letter-spacing:.15em;text-transform:uppercase;
  margin-top:20px;
}
.pill::before{content:'';width:8px;height:8px;border-radius:50%;background:#00ff88;box-shadow:0 0 12px #00ff88}
.name{
  font-size:132px;
  font-weight:900;
  line-height:.95;
  letter-spacing:-.05em;
  margin-top:28px;
  background:linear-gradient(135deg,#fff 0%,#8892a4 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.role{
  font-family:'JetBrains Mono',monospace;
  font-size:26px;
  font-weight:600;
  color:#00ff88;
  margin-top:20px;
  letter-spacing:-.005em;
}
.tags{
  display:flex;gap:10px;flex-wrap:wrap;
  margin-top:22px;
}
.tag{
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  padding:6px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);
  border-radius:5px;
  color:#8892a4;
  letter-spacing:.03em;
}
.tag.g{background:rgba(0,255,136,.06);border-color:rgba(0,255,136,.22);color:#00ff88}
.tag.c{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.22);color:#00d4ff}

.bottom{
  position:relative;z-index:2;
  display:flex;justify-content:space-between;align-items:flex-end;
}
.meta{
  font-family:'JetBrains Mono',monospace;
  font-size:15px;color:#4a5568;
  line-height:2;
}
.meta .k{color:#00d4ff}
.meta .v{color:#edf2f7}
.brand{
  font-family:'JetBrains Mono',monospace;
  text-align:right;
}
.brand .site{
  font-size:20px;color:#edf2f7;font-weight:600;
  letter-spacing:.02em;
}
.brand .site .g{color:#00ff88}
.brand .sub{
  font-size:12px;color:#4a5568;margin-top:6px;
  letter-spacing:.1em;text-transform:uppercase;
}
/* corner accent lines */
.corner{position:absolute;width:34px;height:34px;border:1px solid #00ff88;opacity:.5}
.corner.tl{top:20px;left:20px;border-right:none;border-bottom:none}
.corner.tr{top:20px;right:20px;border-left:none;border-bottom:none}
.corner.bl{bottom:20px;left:20px;border-right:none;border-top:none}
.corner.br{bottom:20px;right:20px;border-left:none;border-top:none}
</style>
</head>
<body>

<div class="grid"></div>
<div class="radial"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="dots-tl">
  <div class="dot r"></div>
  <div class="dot y"></div>
  <div class="dot g"></div>
</div>
<div class="window-title">portfolio.sh — chike.oguh</div>

<div class="top">
  <div class="pill">
    <span>Available for hire</span>
  </div>
  <h1 class="name">Chike Oguh</h1>
  <p class="role">Technical Support Engineer</p>
  <div class="tags">
    <span class="tag g">Infrastructure</span>
    <span class="tag c">Networking</span>
    <span class="tag">WordPress</span>
    <span class="tag">Office 365</span>
    <span class="tag">Active Directory</span>
    <span class="tag c">CCNA</span>
    <span class="tag">Cloud &amp; SaaS</span>
  </div>
</div>

<div class="bottom">
  <div class="meta">
    <div><span class="k">$</span> <span class="v">whoami</span></div>
    <div><span class="k">location:</span>  <span class="v">Portugal</span></div>
    <div><span class="k">exp:</span>       <span class="v">6+ years</span> · <span class="k">languages:</span> <span class="v">EN · PT</span></div>
  </div>
  <div class="brand">
    <div class="site"><span class="g">chike</span>.ng</div>
    <div class="sub">Support Engineer · Portfolio</div>
  </div>
</div>

</body>
</html>
