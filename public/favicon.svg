<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- rounded terminal window bg -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#020408" stroke="url(#g)" stroke-width="1.2"/>
  <!-- window chrome dots -->
  <circle cx="6" cy="6" r="1.2" fill="#ff5f57"/>
  <circle cx="10" cy="6" r="1.2" fill="#febc2e"/>
  <circle cx="14" cy="6" r="1.2" fill="#28c840"/>
  <!-- prompt >_ -->
  <g filter="url(#glow)">
    <path d="M 7 14 L 12 18 L 7 22" stroke="#00ff88" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="14" y="21.2" width="10" height="2.2" rx="1" fill="#00ff88"/>
  </g>
</svg>
