<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Chike Oguh</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0a08">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0a08; --surface: #181512; --ink: #ffffff; --muted: #8f8a84; --accent: #c9a45a; --accent-ink: #0c0a08;
  --line: color-mix(in oklab, #fff 12%, transparent); --line-strong: color-mix(in oklab, #fff 22%, transparent);
  --display: "Schibsted Grotesk", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--display); -webkit-font-smoothing: antialiased; }
main { width: min(100%, 600px); }
.term { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); overflow: hidden; }
.term__head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
.dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
.term__title { font: 400 13px/1 var(--mono); color: var(--muted); }
.term__body { padding: 32px; }
h1 { margin: 0 0 12px; font: 400 clamp(40px, 9vw, 64px)/1.02 var(--display); letter-spacing: -0.04em; }
p { margin: 0; color: color-mix(in oklab, var(--ink) 84%, transparent); max-width: 44ch; }
.log { margin: 24px 0 32px; padding: 16px 18px; border-radius: 12px; background: var(--bg); font: 400 13px/1.9 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.log .p { color: var(--accent); } .log .e { color: #ff9b91; } .log .ok { color: #6fdc8c; } .log .c { color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 24px; border-radius: 8px; border: 1px solid transparent; font: 500 16px/1 var(--display); text-decoration: none; transition: background-color .14s var(--ease), border-color .14s var(--ease), transform .09s var(--ease); }
.btn--primary { background: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { background: color-mix(in oklab, var(--accent) 86%, var(--ink)); transform: translateY(-1px); }
.btn--secondary { color: var(--ink); border-color: var(--line-strong); }
.btn--secondary:hover { background: color-mix(in oklab, var(--bg) 92%, var(--ink)); transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.985); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 639px) { .term__body { padding: 24px; } .row { flex-direction: column; } .btn { width: 100%; height: 48px; } }
</style>
</head>
<body>
<main>
  <div class="term">
    <div class="term__head"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="term__title">error.sh</span></div>
    <div class="term__body">
      <h1>Page not found</h1>
      <p>This address has no page on chike.ng. It may have moved, or the link has a typo.</p>
      <div class="log" aria-hidden="true">
        <div><span class="p">$</span> <span class="c">curl -I</span> https://chike.ng<span data-path></span></div>
        <div><span class="e">HTTP/2 404</span> not found</div>
        <div><span class="p">$</span> <span class="c">open</span> https://chike.ng/</div>
        <div><span class="ok">HTTP/2 200</span> the home page is up</div>
      </div>
      <div class="row">
        <a class="btn btn--primary" href="/">Go to the home page</a>
        <a class="btn btn--secondary" href="mailto:hello@chike.ng">Email hello@chike.ng</a>
      </div>
    </div>
  </div>
</main>
<script>document.querySelector('[data-path]').textContent = location.pathname.slice(0, 80);</script>
</body>
</html>
